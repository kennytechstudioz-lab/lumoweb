name: Deploy Lumo Web

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 300s
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:~/.npm-global/bin
            cd /var/www/projects/banking/lumo/web
            git reset --hard HEAD
            git pull origin main
            printf "%s\n" \
              "NEXT_PUBLIC_API_URL=https://api.lumogroupintl.com/api" \
              "NEXTAUTH_URL=https://lumogroupintl.com" \
              "NEXTAUTH_SECRET=pYn8wB6V2fG9kL4mR5jT1hN3qS7xZ0vC" \
              "AUTH_TRUST_HOST=true" > .env.production
            npm install --legacy-peer-deps
            npm run build
            pm2 restart lumo-web || npx pm2 restart lumo-web
            echo "✅ Lumo Web restarted successfully."


